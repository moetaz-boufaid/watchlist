<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{category}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
    </nav>
    <main>
        <h1>
            {{category}}
        </h1>
        {% for item in items %}
        <div class ="card">
            <h2>{{item["title"]}}</h2>
            <p class="rating">Rating: {{ item["rating"]}}/10</p>
        </div>
        {% endfor %}
    </main>
</body>
</html>
